<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spider-Man - Contact Signal</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<header id="main-header">
  <h1>Send a Signal to Spider-Man</h1>
  <nav aria-label="Main navigation">
    <ul class="nav-menu">
      <li><a href="index.html">Home</a></li>
      <li><a href="movies.html">Movies</a></li>
      <li><a href="about.html">About Team</a></li>
      <li><a class="active" href="contact.html">Contact Us</a></li>
    </ul>
  </nav>
</header>

<main class="container">
  <section class="form-section">
    <h2>Get in Touch</h2>
    <form id="contact-form">
      <div class="form-group">
        <label for="name">Your Name:</label>
        <input type="text" id="name" name="name" required placeholder="Enter your name">
      </div>

      <div class="form-group">
        <label for="email">Your Email:</label>
        <input type="email" id="email" name="email" required placeholder="Enter your email">
      </div>

      <div class="form-group">
        <label for="suit-color">Favorite Spider-Suit Color:</label>
        <select id="suit-color" name="suit-color">
          <option value="classic">Classic Red & Blue</option>
          <option value="black">Symbiote Black</option>
          <option value="iron">Iron Spider (Gold/Red)</option>
          <option value="stealth">Stealth Black</option>
        </select>
      </div>

      <div class="form-group">
        <label for="message">Your Message:</label>
        <textarea id="message" name="message" rows="5" required placeholder="Write your message here..."></textarea>
      </div>

      <button type="submit" class="btn-submit">Send Signal</button>
    </form>
  </section>
</main>

<footer>
  <p class="names">Team members: Ali · Arlan</p>
  <p>Front-End Assignment #1 · HTML &amp; CSS Basics · Astana IT University</p>
  <p><a href="index.html">Back to Home</a> · <a href="#main-header">Back to top</a></p>
</footer>
</body>
</html>
