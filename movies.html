<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Find your next Spider-Man film by title, actor, release year or series.">
  <title>Film archive · Spider Index</title>
  <link rel="icon" href="images/favicon.svg" type="image/svg+xml">
  <script src="js/theme.js"></script>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/catalog.css">
  <script src="js/site.js" defer></script>
  <script src="js/films.js" defer></script>
  <script src="js/catalog.js" defer></script>
</head>
<body data-page="films">
  <header data-site-header></header>
  <main id="main" class="wrap collection-page">
    <div class="page-intro collection-intro">
      <p class="kicker">The collection</p>
      <h1>Film archive</h1>
      <p>Search by title, actor or year, or <a href="index.html#film-finder">get a recommendation</a> for your first movie night.</p>
    </div>
    <section aria-label="Browse the film archive">
      <div class="catalog-tools">
        <div class="era-filters" aria-label="Filter by film series" role="group" id="era-filters"></div>
        <label class="film-search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"></circle><path d="m16 16 5 5"></path></svg>
          <span class="catalog-sr">Search films by title, actor or year</span>
          <input type="search" id="film-search" placeholder="Search films…" autocomplete="off">
        </label>
      </div>
      <p class="catalog-counter" id="result-count" role="status"></p>
      <div id="film-results" class="film-grid"></div>
    </section>
    <p class="catalog-feedback" id="save-message" role="status"></p>
    <noscript><p>Enable JavaScript to search the archive and save films to your watchlist.</p></noscript>
  </main>
  <footer data-site-footer></footer>
</body>
</html>
